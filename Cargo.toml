[package]
name = "github-issue-reproducer"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Capture and run a configurable GitHub issue reproduction"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
